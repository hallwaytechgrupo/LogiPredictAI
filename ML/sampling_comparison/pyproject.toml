[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="logipredict-sampling-study"
version="0.1.0"
requires-python=">=3.12"
dependencies=["logipredict-context-review==0.1.0"]
[project.optional-dependencies]
research=["imbalanced-learn==0.14.2","sklearn-compat==0.1.6","matplotlib>=3.9,<4","nbformat>=5.10,<6","nbclient>=0.10,<1","ipykernel>=6,<8","httpx>=0.28,<1"]
[tool.setuptools.packages.find]
where=["."]
include=["sampling_risk*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logipredict-final-candidate"
version = "0.1.0"
description = "Treino temporal, verificador de alertas e sobrevivência para LogiPredictAI"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scipy==1.18.1", "scikit-learn==1.9.1", "joblib==1.4.2", "catboost==1.2.10", "lightgbm==4.7.0", "xgboost==3.4.1", "pydantic==2.11.4", "fastapi==0.115.12", "uvicorn==0.34.2"]

[project.optional-dependencies]
research = ["matplotlib>=3.9,<4", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["logipredict_final*"]

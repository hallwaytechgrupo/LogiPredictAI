[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="logipredict-context-review"
version="0.1.0"
requires-python=">=3.12"
dependencies=["logipredict-final-candidate==0.1.0"]
[project.optional-dependencies]
research=["matplotlib>=3.9,<4","nbformat>=5.10,<6","nbclient>=0.10,<1","ipykernel>=6,<8","httpx>=0.28,<1"]
[tool.setuptools.packages.find]
where=["."]
include=["context_risk*"]
